services:
  zone1-modbus:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "5020:502"
    environment:
      - CHAL_FLAG=${ZONE1_FLAG:?set ZONE1_FLAG in your .env before deploying}
    restart: unless-stopped
    networks:
      - zone1-net

networks:
  zone1-net:
    driver: bridge
